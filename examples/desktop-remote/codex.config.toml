# Codex reads one config.toml per trusted project, so the per-execution identity
# cannot live in the command line. The controller exports
# AUTUMNINTERCOM_CONNECTION_FILE into the tmux session environment instead; without
# it the bridge refuses rather than serving an empty tool list.
[mcp_servers.autumnintercom-stdio]
command = "/home/worker/.autumn/servers/<install>/current/bin/autumnintercom"
args = ["mcp", "stdio"]
